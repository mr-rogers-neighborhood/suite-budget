appId: run.suite.budget
productName: Suite Budget
executableName: suite-budget
artifactName: "suite-budget-${version}-${os}-${arch}.${ext}"
copyright: Copyright © Suite contributors

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json

extraResources:
  - from: resources
    to: .
# The hub discovers an app by the manifest beside its executable, so this lands next to the
# binary rather than in resources.
extraFiles:
  - from: suite.app.json
    to: suite.app.json

fileAssociations:
  - ext: budget
    name: Suite Budget
    mimeType: application/json

linux:
  target:
    - AppImage
    - deb
  category: Office

mac:
  target:
    - dmg
  category: public.app-category.finance

win:
  target:
    - nsis
